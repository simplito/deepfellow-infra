{{- if .Values.workspace.enabled }}
{{- $cred := include "deepfellow.credentials" . | fromYaml }}
{{- $secretName := include "deepfellow.credSecretName" (dict "context" . "component" "workspace-redis") }}
{{/* The Workspace Redis's chart Secret: its password, when plaintext or generated. */}}
{{- $sec := include "deepfellow.chartSecret" (dict "context" . "secretName" $secretName "creds" (list $cred.workspace.redis.password)) }}
{{- with $sec }}
{{ . }}
{{- end }}
{{- end }}
