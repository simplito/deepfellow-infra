{{- if .Values.networkPolicy.enabled }}
{{- $inst := .Release.Name }}
{{- if .Values.server.falkordb.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deepfellow.componentName" (dict "context" . "component" "falkordb") }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: falkordb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: server
{{- end }}
{{- end }}
