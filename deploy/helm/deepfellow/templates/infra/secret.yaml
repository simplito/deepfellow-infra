{{- $cred := include "deepfellow.credentials" . | fromYaml -}}
{{- $secretName := include "deepfellow.credSecretName" (dict "context" . "component" "infra") -}}
{{/* Infra's chart Secret: its plaintext and generated credentials. */}}
{{- $sec := include "deepfellow.chartSecret" (dict "context" . "secretName" $secretName "creds" (list $cred.infra.auth.adminApiKey $cred.infra.auth.serverApiKey $cred.infra.huggingFaceToken $cred.infra.mesh.childKey $cred.infra.mesh.parent.key)) -}}
{{- with $sec }}
{{ . }}
{{- end }}
