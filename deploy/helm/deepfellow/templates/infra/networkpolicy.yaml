{{- if .Values.networkPolicy.enabled }}
{{- $inst := .Release.Name }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deepfellow.componentName" (dict "context" . "component" "infra") }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: infra
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: server
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: provisioning
      ports:
        - port: {{ include "deepfellow.port" "infra.http" }}
          protocol: TCP
    {{- with .Values.infra.mesh.allowChildrenFrom }}
    {{/* Child Infras joining this one's mesh; they authenticate with infra.mesh.childKey. */}}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ include "deepfellow.port" "infra.http" }}
          protocol: TCP
    {{- end }}
{{- end }}
