{{- if .Values.provisioning.enabled }}
{{- $fullname := include "deepfellow.componentName" (dict "context" . "component" "provisioning") }}
{{- $sa := include "deepfellow.provisioning.serviceAccountName" . }}
{{- if .Values.provisioning.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
