{{- if .Values.provisioning.enabled }}
{{/* One chart Secret per external backend whose apiKey is plaintext or generated. */}}
{{- range $name, $bRaw := .Values.externalBackends }}
{{- if include "deepfellow.backendEnabled" (dict "b" $bRaw) }}
{{- $ak := (include "deepfellow.normalizedExternalBackend" (dict "raw" $bRaw "name" $name) | fromYaml).apiKey }}
{{- if or (eq $ak.source "plaintext") (eq $ak.source "generate") }}
{{- $extSecret := include "deepfellow.credSecretName" (dict "context" $ "component" (printf "ext-%s" $name)) }}
{{- $sec := include "deepfellow.chartSecret" (dict "context" $ "secretName" $extSecret "creds" (list $ak)) }}
{{- with $sec }}
---
{{ . }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
