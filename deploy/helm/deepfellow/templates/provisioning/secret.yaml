{{- if .Values.provisioning.enabled }}
{{- $cred := include "deepfellow.credentials" . | fromYaml }}
{{- $secretName := include "deepfellow.credSecretName" (dict "context" . "component" "provisioning") }}
{{/* The provisioning Job's chart Secret: the password of the Server admin it creates. */}}
{{- $sec := include "deepfellow.chartSecret" (dict "context" . "secretName" $secretName "creds" (list $cred.provisioning.admin.password)) }}
{{- with $sec }}
{{ . }}
{{- end }}
{{- end }}
