{{- if .Values.ingress.enabled }}
{{- $server := include "deepfellow.componentName" (dict "context" . "component" "server") }}
{{- $workspace := include "deepfellow.componentName" (dict "context" . "component" "workspace") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "deepfellow.componentName" (dict "context" . "component" "ingress") }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- with .Values.ingress.server.host }}
    - host: {{ . }}
      http:
        paths:
          - path: {{ $.Values.ingress.server.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $server }}
                port:
                  number: {{ $.Values.server.service.port }}
    {{- end }}
    {{- if and .Values.workspace.enabled .Values.ingress.workspace.host }}
    - host: {{ .Values.ingress.workspace.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $workspace }}
                port:
                  number: {{ .Values.workspace.service.port }}
    {{- end }}
{{- end }}
