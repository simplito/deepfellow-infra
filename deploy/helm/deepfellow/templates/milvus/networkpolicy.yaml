{{- if .Values.networkPolicy.enabled }}
{{- $inst := .Release.Name }}
{{- if include "deepfellow.milvus.inChart" . }}
{{/* The default-deny above covers every pod in the release, so the Milvus stack needs its own
     allows or Milvus cannot reach etcd/MinIO and the Server cannot reach Milvus. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deepfellow.componentName" (dict "context" . "component" "milvus") }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: milvus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: server
      ports:
        - port: {{ include "deepfellow.port" "milvus.grpc" }}
          protocol: TCP
        # the Server's init container waits on Milvus's /healthz
        - port: {{ include "deepfellow.port" "milvus.metrics" }}
          protocol: TCP
{{- end }}
{{- end }}
