{{- $cred := include "deepfellow.credentials" . | fromYaml -}}
{{- $secretName := include "deepfellow.credSecretName" (dict "context" . "component" "server") -}}
{{- $s := .Values.server -}}
{{/* The Server's chart Secret: the FalkorDB and metrics passwords, and in external Mongo mode the
     Mongo password, since no chart Mongo Secret exists then. */}}
{{- $creds := list -}}
{{- if $s.falkordb.enabled -}}{{- $creds = append $creds $cred.server.falkordb.password -}}{{- end -}}
{{- if $s.metrics.basicAuth.enabled -}}{{- $creds = append $creds $cred.server.metrics.basicAuth.password -}}{{- end -}}
{{- if not (include "deepfellow.mongo.inChart" .) -}}{{- $creds = append $creds $cred.server.mongo.password -}}{{- end -}}
{{- $sec := include "deepfellow.chartSecret" (dict "context" . "secretName" $secretName "creds" $creds) -}}
{{- with $sec }}
{{ . }}
{{- end }}
