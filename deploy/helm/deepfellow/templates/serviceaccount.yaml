{{- if .Values.serviceAccount.create }}
{{/* Shared by the workloads; none needs the API, so the token is off here and on every pod. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deepfellow.serviceAccountName" . }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
