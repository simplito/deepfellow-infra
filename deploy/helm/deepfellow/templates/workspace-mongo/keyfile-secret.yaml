{{- if .Values.workspace.enabled }}
{{- $cred := include "deepfellow.credentials" . | fromYaml }}
{{/* The Workspace's own MongoDB replica set; see statefulset.yaml in this directory. */}}
{{- $w := .Values.workspace }}
{{/* Replica-set keyFile: its own Secret because it needs a base64-charset generator. */}}
{{- $appMongoKeySecret := include "deepfellow.credSecretName" (dict "context" . "component" "workspace-mongo-keyfile") }}
{{- $amKey := include "deepfellow.chartSecret" (dict "context" . "secretName" $appMongoKeySecret "generator" "deepfellow.genKeyFileValue" "creds" (list $cred.workspace.mongo.keyFile)) }}
{{- with $amKey }}
{{ . }}
{{- end }}
{{- end }}
