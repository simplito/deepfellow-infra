{{- $amSec := include "deepfellow.chartSecret" (dict "context" . "secretName" $appMongoSecret "creds" (list $cred.workspace.mongo.rootPassword)) }}
{{- with $amSec }}
{{ . }}
{{- end }}
{{- end }}
