{{- if .Values.networkPolicy.enabled }}
{{- $inst := .Release.Name }}
{{- if .Values.workspace.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deepfellow.componentName" (dict "context" . "component" "workspace-mongo") }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: workspace-mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: workspace
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: workspace-mongo
      ports:
        - port: {{ include "deepfellow.port" "workspace-mongo.mongo" }}
          protocol: TCP
{{- end }}
{{- end }}
