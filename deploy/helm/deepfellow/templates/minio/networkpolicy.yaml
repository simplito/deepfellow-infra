{{- if .Values.networkPolicy.enabled }}
{{- $inst := .Release.Name }}
{{- if include "deepfellow.milvus.inChart" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deepfellow.componentName" (dict "context" . "component" "minio") }}
  labels:
    {{- include "deepfellow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/component: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/component: milvus
      ports:
        - port: {{ include "deepfellow.port" "minio.api" }}
          protocol: TCP
{{- end }}
{{- end }}
