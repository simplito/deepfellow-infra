# Quickstart: a complete configuration for trying the suite.
#
#   helm install deepfellow ./deepfellow -f ./deepfellow/values-quickstart.yaml
#
# The chart's defaults refuse to render until you decide where each credential comes from and
# which images you trust. This file makes those decisions for a trial:
#
#   * every credential is generated by the chart and kept on uninstall;
#   * the model backend's image is accepted by tag instead of a pinned digest;
#   * one ~400MB model is downloaded so there is something to talk to.
#
# Not for production. Pin image digests, move credentials to Secrets you manage (`secretRef`;
# under GitOps `generate` mints new values on every render), and read the README on storage and
# on what `helm uninstall` leaves behind.
#
# Storage: the cluster default is used. MongoDB does not run on NFS; if your default class is NFS,
# add `--set server.mongo.embedded.storage.storageClass=local-path` and
# `--set workspace.mongo.storage.storageClass=local-path`.

infra:
  auth:
    adminApiKey:
      generate: true
    serverApiKey:
      generate: true

# Qwen2.5-0.5B-Instruct, ~400MB.
modelBackends:
  demo:
    modelId: demo-llm
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server
      allowMutableTag: true
    gguf:
      url: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
    threads: 2
    contextLength: 2048
    storage:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "2"
        memory: 1Gi

server:
  mongo:
    password:
      generate: true
    embedded:
      rootPassword:
        generate: true

workspace:
  helperModel: demo-llm         # must name a model this release serves
  auth:
    sessionSecret:
      generate: true
    bootstrapAdmin:
      password:
        generate: true
  mongo:
    rootPassword:
      generate: true
    keyFile:
      generate: true
  redis:
    password:
      generate: true

provisioning:
  enabled: true
  admin:
    password:
      generate: true

networkPolicy:
  enabled: true
