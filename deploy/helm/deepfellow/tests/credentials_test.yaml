# The credential contract: one of secretRef (an existing Secret) / plaintext (the raw value) /
# generate, plus secretKey, the key inside whichever Secret holds it.
suite: credentials
templates:
  - validation.yaml
  - infra/deployment.yaml
  - infra/secret.yaml
values:
  - ../ci/core-values.yaml
tests:
  - it: refuses two sources for one credential, and says how to switch in an overlay
    template: infra/secret.yaml
    set:
      infra.auth.serverApiKey: { plaintext: abc, generate: true }
    asserts:
      - failedTemplate:
          errorPattern: "infra.auth.serverApiKey: set only one of secretRef, plaintext or generate .got plaintext, generate.. To switch in a values overlay, set the old one to null"
  - it: says what to set when a required credential is empty, whichever template fails first
    template: infra/deployment.yaml
    set:
      infra.auth.adminApiKey.plaintext: null
    asserts:
      - failedTemplate:
          errorPattern: "infra.auth.adminApiKey is required: set one of secretRef, plaintext or generate"
  - it: rejects the old shapes instead of ignoring them
    template: validation.yaml
    set:
      infra.auth.serverApiKey: { source: value, value: abc }
    asserts:
      - failedTemplate: {}
  - it: rejects a map where the Secret name belongs
    template: validation.yaml
    set:
      infra.auth.serverApiKey: { plaintext: null, secretRef: { name: my-secret } }
    asserts:
      - failedTemplate: {}
  - it: stores a plaintext value in the chart's Secret under the secretKey you choose
    template: infra/secret.yaml
    set:
      infra.auth.serverApiKey: { plaintext: abc, secretKey: custom-key }
    asserts:
      - exists:
          path: 'data["custom-key"]'
      - notExists:
          path: 'data["infra-api-key"]'
  - it: reads a chart-stored value from that same custom secretKey
    template: infra/deployment.yaml
    set:
      infra.auth.serverApiKey: { plaintext: abc, secretKey: custom-key }
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content:
            name: DF_INFRA_API_KEY
            valueFrom: { secretKeyRef: { name: RELEASE-NAME-deepfellow-infra-creds, key: custom-key } }
  - it: reads a referenced Secret under the credential's documented key
    template: infra/deployment.yaml
    set:
      infra.auth.adminApiKey: { plaintext: null, secretRef: my-infra }
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content:
            name: DF_INFRA_ADMIN_API_KEY
            valueFrom: { secretKeyRef: { name: my-infra, key: infra-admin-api-key } }
  - it: honours secretKey for a referenced Secret
    template: infra/deployment.yaml
    set:
      infra.auth.adminApiKey: { plaintext: null, secretRef: my-infra, secretKey: admin }
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content:
            name: DF_INFRA_ADMIN_API_KEY
            valueFrom: { secretKeyRef: { name: my-infra, key: admin } }
  - it: keeps a Secret that holds a generated value on uninstall
    template: infra/secret.yaml
    set:
      infra.auth.adminApiKey: { plaintext: null, generate: true }
    release:
      upgrade: false
    asserts:
      - equal:
          path: 'metadata.annotations["helm.sh/resource-policy"]'
          value: keep
  - it: always runs Infra without Docker, serving only registered backends
    template: infra/deployment.yaml
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content: { name: DF_EXTERNAL_ONLY, value: "true" }
  - it: gives Infra a fixed, non-secret mesh placeholder while no mesh is joined
    template: infra/deployment.yaml
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content: { name: DF_MESH_KEY, value: unused-change-to-join-a-mesh }
  - it: reads the key other Infras must present (DF_MESH_KEY) from a Secret once one is set
    template: infra/deployment.yaml
    set:
      infra.mesh.childKey: { secretRef: my-mesh }
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content:
            name: DF_MESH_KEY
            valueFrom: { secretKeyRef: { name: my-mesh, key: mesh-child-key } }
  - it: joins a parent mesh with DF_CONNECT_TO_MESH_KEY, not DF_MESH_KEY
    template: infra/deployment.yaml
    set:
      infra.mesh.parent: { enabled: true, url: "https://parent.example", key: { secretRef: parent-key } }
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content:
            name: DF_CONNECT_TO_MESH_KEY
            valueFrom: { secretKeyRef: { name: parent-key, key: mesh-parent-key } }
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content: { name: DF_CONNECT_TO_MESH_URL, value: "https://parent.example" }
  - it: requires the parent's key when joining a mesh
    template: infra/deployment.yaml
    set:
      infra.mesh.parent: { enabled: true, url: "https://parent.example" }
    asserts:
      - failedTemplate:
          errorPattern: "infra.mesh.parent.key is required"
  - it: still refuses to mint a generated value on an upgrade it cannot check against the cluster
    template: infra/secret.yaml
    set:
      infra.auth.adminApiKey: { plaintext: null, generate: true }
    release:
      upgrade: true
    asserts:
      - failedTemplate:
          errorPattern: "cannot be read back: this render has no cluster access"
  - it: refuses to open Infra to child Infras while the child key is the placeholder
    template: validation.yaml
    set:
      infra.mesh.allowChildrenFrom: [{ namespaceSelector: { matchLabels: { team: edge } } }]
    asserts:
      - failedTemplate:
          errorPattern: "infra.mesh.allowChildrenFrom opens Infra to child Infras: set infra.mesh.childKey"
